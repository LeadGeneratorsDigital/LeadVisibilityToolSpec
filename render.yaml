# API for the Lead Visibility Tool (spec section 3: Render.com). The web app deploys to Vercel from apps/web.
services:
  - type: web
    name: lead-visibility-api
    runtime: node
    plan: free
    region: frankfurt
    # NODE_ENV=production makes pnpm skip devDependencies, but the build needs tsup.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @lvt/api build
    startCommand: pnpm --filter @lvt/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Test deploy on the DataForSEO sandbox (dummy SERPs); set DATAFORSEO_MODE=live and remove
      # ALLOW_MOCKS once the client's funded login is in DATAFORSEO_LOGIN / DATAFORSEO_PASSWORD.
      - key: ALLOW_MOCKS
        value: "true"
      - key: DATAFORSEO_MODE
        value: sandbox
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Comma-separated; set to the Vercel production URL, e.g. https://lead-visibility.vercel.app
      - key: CORS_ORIGIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
