# Render Blueprint: everything the app needs on Render's free plan (see README "Deploying").
# The pages are a static site, which never sleeps; only the ranking API sleeps after 15 idle minutes.
services:
  - type: web
    runtime: static
    name: lead-visibility-web
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @lvt/web build
    staticPublishPath: apps/web/dist
    domains:
      - rankings.leadgenerators.co.uk
    routes:
      # Client-side routes (/leads/:id) have no file; the app shell handles them.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # The API service's URL, e.g. https://lead-visibility-api.onrender.com (no trailing slash).
      - key: VITE_API_URL
        sync: false

  - type: web
    runtime: node
    name: lead-visibility-api
    plan: free
    region: frankfurt
    # NODE_ENV=production makes pnpm skip devDependencies, but the build needs tsup.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @lvt/api build
    startCommand: pnpm --filter @lvt/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATAFORSEO_MODE
        value: live
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Comma-separated web origins allowed to call the API.
      - key: CORS_ORIGIN
        value: https://rankings.leadgenerators.co.uk,https://lead-visibility-web.onrender.com
